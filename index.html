<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unggah & Kelola Berkas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-image {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 0.5rem;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            background-color: rgba(0, 0, 0, 0.5);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .file-type-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-image {
            background-color: #dbeafe;
            color: #0369a1;
        }

        .badge-other {
            background-color: #f3e8ff;
            color: #7e22ce;
        }

        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex flex-col items-center justify-start p-6">

    <!-- Modal untuk preview gambar -->
    <div id="imageModal" class="modal">
        <div style="position: relative;">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalImage" class="modal-image" alt="Preview">
        </div>
    </div>

    <!-- HALAMAN 1: UPLOAD BERKAS -->
    <div id="page-upload" class="w-full max-w-2xl">
        <div class="bg-white rounded-2xl shadow-2xl p-8 md:p-12 text-center">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent mb-2">Unggah Lampiran</h1>
            <p class="text-sm text-gray-500 mb-10">Format: JPG, JPEG, PNG, GIF, DOCX, PDF (Max: 500KB)</p>
            
            <form action="upload.php" method="post" enctype="multipart/form-data" class="space-y-8">
                <label class="border-4 border-dashed border-blue-300 bg-blue-50 rounded-2xl p-12 md:p-16 flex flex-col items-center justify-center cursor-pointer">
                    <input type="file" name="fileToUpload" id="fileToUpload" class="hidden" onchange="updateFileName()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-blue-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    <span id="file-label" class="text-lg text-gray-600 font-semibold">Klik atau seret berkas ke sini</span>
                </label>

                <button type="submit" name="submit" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold py-4 text-lg rounded-xl shadow-lg">
                    Unggah Sekarang
                </button>
            </form>

            <div class="mt-10 pt-10 border-t-2 border-gray-200">
                <button onclick="goToPage('list')" class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-800 font-semibold hover:underline text-sm md:text-base">
                    <span>👉</span> Lihat Daftar Berkas
                </button>
            </div>
        </div>
    </div>

    <!-- HALAMAN 2: DAFTAR BERKAS -->
    <div id="page-list" class="w-full max-w-4xl hidden">
        <div class="bg-white rounded-2xl shadow-2xl p-8 md:p-12">
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-8">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-800">📁 Daftar Berkas</h1>
                <button onclick="goToPage('upload')" class="w-full md:w-auto bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-xl text-sm md:text-base font-semibold transition">
                    ➕ Unggah Berkas Baru
                </button>
            </div>
            
            <div id="file-list-grid" class="space-y-3">
                <div class="flex justify-center items-center py-12">
                    <div class="flex flex-col items-center space-y-2">
                        <div class="loading-spinner"></div>
                        <span class="text-gray-400 text-sm">Memuat berkas...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Navigasi antar halaman
        function goToPage(page) {
            const uploadPage = document.getElementById('page-upload');
            const listPage = document.getElementById('page-list');
            
            if (page === 'upload') {
                listPage.classList.add('hidden');
                uploadPage.classList.remove('hidden');
                window.scrollTo(0, 0);
            } else if (page === 'list') {
                uploadPage.classList.add('hidden');
                listPage.classList.remove('hidden');
                loadFiles();
                window.scrollTo(0, 0);
            }
        }

        // Mengubah teks petunjuk saat file dipilih
        function updateFileName() {
            const input = document.getElementById('fileToUpload');
            const label = document.getElementById('file-label');
            if(input.files.length > 0) {
                label.innerText = "✓ Berkas terpilih: " + input.files[0].name;
                label.classList.remove('text-gray-600');
                label.classList.add('text-blue-600', 'font-bold');
            }
        }

        // Buka modal preview
        function openModal(imageSrc) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            modalImage.src = imageSrc;
            modal.classList.add('active');
        }

        // Tutup modal
        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
        }

        // Tutup modal saat klik di luar gambar
        window.onclick = function(event) {
            const modal = document.getElementById('imageModal');
            if (event.target == modal) {
                modal.classList.remove('active');
            }
        }

        // Mengambil daftar file dari upload.php
        async function loadFiles() {
            try {
                const response = await fetch('upload.php?aksi=list');
                const files = await response.json();
                const fileGrid = document.getElementById('file-list-grid');
                fileGrid.innerHTML = '';

                if (files.length === 0) {
                    fileGrid.innerHTML = `
                        <div class="py-12 text-center">
                            <div class="text-5xl mb-3">📭</div>
                            <p class="text-gray-400 font-semibold text-base">Belum ada berkas.</p>
                        </div>
                    `;
                    return;
                }

                files.forEach(file => {
                    const isImage = ['JPG', 'JPEG', 'PNG', 'GIF'].includes(file.tipe);
                    const badgeClass = isImage ? 'badge-image' : 'badge-other';
                    
                    const item = document.createElement('div');
                    item.className = 'bg-gradient-to-r from-gray-50 to-gray-100 border border-gray-200 rounded-lg p-4 flex items-center justify-between';
                    
                    let previewHTML = '';
                    if (isImage) {
                        previewHTML = `
                            <img src="uploads/${file.nama}" alt="Preview" class="w-16 h-16 object-cover rounded-lg cursor-pointer shadow-md" onclick="openModal('uploads/${file.nama}')">
                        `;
                    } else {
                        previewHTML = `
                            <div class="w-16 h-16 bg-gradient-to-br from-purple-200 to-purple-100 rounded-lg flex items-center justify-center text-2xl">
                                📄
                            </div>
                        `;
                    }
                    
                    item.innerHTML = `
                        <div class="flex items-center gap-4 flex-grow min-w-0">
                            ${previewHTML}
                            <div class="flex-grow min-w-0">
                                <p class="text-gray-700 font-semibold text-sm truncate">
                                    ${file.nama}
                                </p>
                                <div class="flex items-center gap-2 mt-2">
                                    <span class="file-type-badge ${badgeClass}">${file.tipe}</span>
                                    <span class="text-xs text-gray-500">${file.ukuran}</span>
                                </div>
                            </div>
                        </div>
                        <div class="ml-3 flex gap-2 flex-shrink-0">
                            <a href="uploads/${file.nama}" download class="bg-blue-100 text-blue-600 px-4 py-2 rounded-lg text-sm font-semibold border border-blue-300">
                                Unduh
                            </a>
                            <button type="button" onclick="deleteFile('${file.nama}')" class="bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm font-semibold border border-red-300">
                                Hapus
                            </button>
                        </div>
                    `;
                    fileGrid.appendChild(item);
                });
            } catch (error) {
                console.error("Gagal memuat berkas:", error);
                document.getElementById('file-list-grid').innerHTML = `<div class="py-8 text-center text-red-500 text-sm">❌ Error memuat berkas</div>`;
            }
        }

        // Fungsi untuk menghapus file
        async function deleteFile(filename) {
            if (confirm(`Apakah Anda yakin ingin menghapus berkas "${filename}"?`)) {
                try {
                    await fetch(`upload.php?aksi=hapus&nama=${encodeURIComponent(filename)}`);
                    loadFiles(); // Muat ulang setelah dihapus
                } catch (error) {
                    console.error("Error menghapus file:", error);
                    alert("Gagal menghapus file");
                }
            }
        }

        // Refresh otomatis setiap 5 detik saat di halaman list
        setInterval(() => {
            if (!document.getElementById('page-list').classList.contains('hidden')) {
                loadFiles();
            }
        }, 5000);
    </script>
</body>
</html>
